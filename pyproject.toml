[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uq-genomics"
version = "1.0.0"
description = "Empirical analysis of uncertainty quantification methods for deep learning in genomics"
readme = "README.md"
authors = [
    { name = "Sepideh Saran" },
    { name = "Mahsa Ghanbari" },
    { name = "Uwe Ohler" },
]
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
train = [
    "tensorflow==2.16.1",
    "tensorflow-probability==0.24.0",
    "tf-keras==2.16.0",
]
xai = ["logomaker==0.8", "shap==0.45.1"]
tracking = ["neptune==1.10.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
