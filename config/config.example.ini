; Example configuration. Copy to config/config.ini and edit.
; config/config.ini is git-ignored so local edits and any credentials stay out
; of version control. Never put an API token in this file.

[general]
version = 19
owner = your.name@example.org
random_seed = 7
# for averaging sevaral runs
ls_random_seeds= 7, 9, 3, 15, 17
#1, 7, 5, 3, 10
verbose = True
save_intermediate_res = True
neptune_project =          ; optional, e.g. user/project
neptune_token =            ; leave empty. set NEPTUNE_API_TOKEN in your shell instead
# select between training, generate_evaluation, generate_figures, comparison and all
run_mode = generate_evaluation
# Data, model and result trees. Each must end with a slash; the code appends the
# dataset setting name (e.g. rbp/real_human/balanced/single_label/3class_split7).
#   path_datasets: holds datasets/<task>/<species>/... split pickles
#   path_models:   trained checkpoints, one tree per model version (v_17 rbp, v_18 tf, v_19 gex)
#   path_results:  where generate_evaluation writes iter_preds_*.pickle
path_datasets = /path/to/data/datasets/
path_models = /path/to/data/models_tf_paper_3/
path_results = /path/to/data/results_tf_paper_3/

[data_files]
# RBP simulated 6-class
simulated_balanced_singlelabel_6class_nonoise = ds1_balanced_singlelabel_1rep_6class_simulated.pickle
simulated_imbalanced_singlelabel_6class_nonoise = ds2_imbalanced_singlelabel_1rep_6class_simulated.pickle
simulated_balanced_multilabel_6class_nonoise = -.pickle
simulated_imbalanced_multilabel_6class_nonoise = -.pickle
simulated_balanced_singlelabel_6class_noisetype1 = ds9_noisy1_balanced_singlelabel_1rep_6class_simulated.pickle
simulated_balanced_singlelabel_6class_noisetype2 = ds10_noisy2_balanced_singlelabel_1rep_6class_simulated.pickle
simulated_balanced_singlelabel_6class_nonoise_2rep = ds3_balanced_singlelabel_2rep_6class_simulated.pickle
simulated_imbalanced_singlelabel_6class_nonoise_2rep = ds4_imbalanced_singlelabel_2rep_6class_simulated.pickle
# RBP simulated 3-class
simulated_balanced_singlelabel_3class_nonoise = ds5_balanced_singlelabel_1rep_3class_simulated.pickle
simulated_imbalanced_singlelabel_3class_nonoise = ds6_imbalanced_singlelabel_1rep_3class_simulated.pickle
simulated_balanced_multilabel_3class_nonoise = ds13_balanced_multilabel_1rep_3class_simulated.pickle
simulated_balanced_singlelabel_3class_noisetype1 = ds7_noisy1_balanced_singlelabel_1rep_3class_simulated.pickle
simulated_balanced_multilabel_3class_nonoise_specialcase = ds13ds5_mixed_balanced_multilabel_1rep_3class_simulated.pickle
# RBP real 3-class
real_balanced_singlelabel_3class_nonoise = 20211001_balanced_dataset_single_label_3classes.pickle
real_imbalanced_singlelabel_3class_nonoise = -.pickle
real_balanced_multilabel_3class_nonoise = 20210927_balanced_dataset_3classes.pickle
real_imbalanced_multilabel_3class_nonoise = 20210302_dataset_3classes.pickle
# RBP other
simulated_testset_nomotif = test_set_no_motif_150_2000.pickle
# TF simulated 6-class
tf_simulated_balanced_singlelabel_6class_nonoise = dstf1_balanced_singlelabel_1rep_6class_simulated.pickle
tf_simulated_imbalanced_singlelabel_6class_nonoise = dstf2_imbalanced_singlelabel_1rep_6class_simulated.pickle
tf_simulated_balanced_singlelabel_6class_nonoise_2rep = dstf3_balanced_singlelabel_2rep_6class_simulated.pickle
tf_simulated_imbalanced_singlelabel_6class_nonoise_2rep = dstf4_imbalanced_singlelabel_2rep_6class_simulated.pickle
tf_simulated_balanced_multilabel_6class_nonoise = -.pickle
tf_simulated_imbalanced_multilabel_6class_nonoise = -.pickle
tf_simulated_balanced_singlelabel_6class_noisetype1 = -.pickle
tf_simulated_balanced_singlelabel_6class_noisetype2 = -.pickle
# RBP application low RBPs - 27 classes
app_rbp_real_imbalanced_multilabel_27classlow_nonoise = real_imbalanced_multilabel_27classlow_nonoise.pickle
app_rbp_real_imbalanced_singlelabel_27classlow_nonoise = real_imbalanced_singlelabel_27classlow_nonoise.pickle
# add MNIST later

# virus data - only testset - no labels - not padded - 1nt sliding window
virus_cov229e = CoV229E_testdata.pkl
virus_sarscov1 = SARS_CoV_1_testdata.pkl
virus_hku1 = HKU1_testdata.pkl
virus_mers = MERS_testdata.pkl
virus_nc045512 = NC_045512_testdata.pkl
virus_oc43 = OC43_testdata.pkl
virus_wuhcor1 = wuhCor1_testdata.pkl
virus_nl63 = NL63_testdata.pkl

[input_data_selection]
# deprecated : choice of rbp or gex or mnist or virus - now available rbp and tf 
classification_task = rbp
n_classes = 3
# if application is true: is using uncertainty scores for filtering predictions
# set to False, when used for benchmarking analysis and comparison
application_mode = False
application_setting_name = app_rbp_real_imbalanced_singlelabel_27classlow_nonoise
# if in comparison mode - application_mode = False
balanced_dataset = True
multi_label = False
# real_human - simulated_human
data_type_species = real_human
# noise no_motif , mislabeled 
noise = none
seq_length = 150
test_virus = nc045512

[model_selection]
# choice of det (deterministic), ens (deep ensemble), bnn (bayesian neural network with mean field variational inference), mcd (mc-dropout)
model_type = det
# try 0.25, 0.3, 0.5
dropout_rate_1 = 0.25
dropout_rate_2 = 0.25
dropout_rate_3 = 0.25
nodes_dense_1 = 250
mcd_dropout_at_ineference_1 = False
mcd_dropout_at_ineference_2 = False
mcd_dropout_at_ineference_3 = True
batch_size = 128
# for 3-6 classes:
# DET - ENS - MCD: 50 epochs, patience 5
# BNN single-label: 100 epochs, patience 50
# BNN multi-label:  1000 epochs, patience 100, learning_rate 0.005
# BNN needs a lower learning rate than the other methods to converge; the
# multi-label setting needs the lowest.
epochs = 50
patience = 5
early_stopping = True
# 0.002 for DET, ENS and MCD; 0.005 for BNN (training protocol of the paper, Section S1.1.3)
learning_rate = 0.002
# for generating initializers for models in deep ensemble
ls_random_init_seeds= 5, 6, 7, 9, 11, 13, 15, 16, 18, 20 
init_weight_normal_mean = 0.0
init_weight_normal_sd = 1.0

[evaluation]
# was origincally 1000
n_iterations = 100

[xai]
# choice of integrated_gradients and deep_shap
xai_method = integrated_gradients
n_plot_samples_per_class = 10
# currently only zeros is supported - to add shuffled seq and uq-specific background such as clear zero-seq with motifs
baseline = zeros
n_steps = 50


